<div class="admin-layout">
  <!-- ================= SIDEBAR ================= -->
  <aside class="admin-sidebar">
    <!-- Brand -->
    <button type="button" class="brand-button" (click)="goDashboard()">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 400 400">
          <g stroke="#C9A24B" stroke-width="7" fill="none">
            <circle cx="200" cy="200" r="150"></circle>
            <path d="M200 60 L200 340"></path>
            <path d="M60 200 L340 200"></path>
            <path d="M97 97 L303 303"></path>
            <path d="M303 97 L97 303"></path>
          </g>
        </svg>
      </div>

      <div class="brand-text">
        <span class="brand-name">Friend Finder</span>
        <span class="brand-role">Admin Panel</span>
      </div>
    </button>

    <!-- Navigation -->
    <nav class="admin-nav">
      <button
        type="button"
        class="nav-item"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">▦</span>
        <span>Dashboard</span>
      </button>

      <button type="button" class="nav-item" routerLink="/admin/users" routerLinkActive="active">
        <span class="nav-icon">♙</span>
        <span>Users</span>
      </button>

      <button type="button" class="nav-item" routerLink="/admin/posts" routerLinkActive="active">
        <span class="nav-icon">▤</span>
        <span>Posts</span>
      </button>

      <button type="button" class="nav-item" routerLink="/admin/contacts" routerLinkActive="active">
        <span class="nav-icon">✉</span>
        <span>Contacts</span>
      </button>
    </nav>

    <!-- Sidebar Bottom -->
    <div class="sidebar-bottom">
      <div class="admin-identity">
        <div class="admin-avatar">AS</div>

        <div class="admin-info">
          <strong>Admin System</strong>
          <span>Administrator</span>
        </div>
      </div>

      <button type="button" class="logout-button" (click)="logout()">
        <span>↪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <p class="topbar-label">Administration</p>

        <span class="topbar-badge"> ADMIN </span>
      </div>
    </header>

    <section class="admin-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
