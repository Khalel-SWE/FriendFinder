<div class="relative w-full flex-1 flex flex-col hero-bg overflow-hidden">
  <div class="hero-vignette"></div>

  <div
    class="relative flex-1 flex items-center justify-center lg:justify-start px-6 sm:px-20 py-10 w-full h-full"
  >
    <svg
      viewBox="0 0 400 400"
      class="hidden lg:block absolute ltr:right-[10%] rtl:left-[10%] top-1/2 -translate-y-1/2 w-[34rem] h-[34rem] opacity-[0.35] pointer-events-none"
    >
      <g class="orbit-rev">
        <circle
          cx="200"
          cy="200"
          r="188"
          fill="none"
          stroke="#E4D4A6"
          stroke-opacity=".35"
          stroke-width="1"
          stroke-dasharray="2 7"
        />
      </g>
      <g class="orbit">
        <circle
          cx="200"
          cy="200"
          r="150"
          fill="none"
          stroke="#C9A24B"
          stroke-opacity=".45"
          stroke-width="1"
        />
      </g>
      <g stroke="#C9A24B" stroke-opacity=".6" stroke-width="1.2" fill="none">
        <line x1="200" y1="30" x2="200" y2="370" />
        <line x1="30" y1="200" x2="370" y2="200" />
        <line x1="97" y1="97" x2="303" y2="303" />
        <line x1="303" y1="97" x2="97" y2="303" />
      </g>
      <circle cx="200" cy="200" r="46" fill="none" stroke="#E4D4A6" stroke-width="1.5" />
      <text
        x="200"
        y="207"
        text-anchor="middle"
        font-family="Cormorant Garamond"
        font-style="italic"
        font-size="26"
        fill="#E4D4A6"
      >
        FF
      </text>
    </svg>

    <div
      class="relative z-10 pennant-wrap w-full max-w-sm reveal mx-auto lg:mx-0 lg:ltr:ml-[10%] lg:rtl:mr-[10%]"
    >
      <div class="pennant px-8 pt-9">
        <div
          class="inline-flex items-center gap-1 bg-white/5 border border-white/10 rounded-full p-1 mb-6"
        >
          <a
            routerLink="/login"
            class="tab-pill active-tab text-xs px-4 py-1.5 rounded-full font-semibold"
            >{{ dict.tab_login[currentLang] }}</a
          >
          <a
            routerLink="/register"
            class="tab-pill text-xs px-4 py-1.5 rounded-full font-semibold hover:text-white"
            >{{ dict.tab_register[currentLang] }}</a
          >
        </div>

        <p class="text-[11px] tracking-[0.3em] text-gold uppercase mb-2">
          {{ dict.login_eyebrow[currentLang] }}
        </p>
        <h1 class="font-display italic text-white text-3xl leading-tight mb-2">
          {{ dict.login_headline[currentLang] }}
        </h1>
        <p class="text-white/45 text-sm mb-7">{{ dict.login_welcome_sub[currentLang] }}</p>

        <form class="space-y-5">
          <div>
            <label
              class="block text-[11px] font-semibold tracking-widest uppercase text-white/50 mb-2"
              >{{ dict.label_email[currentLang] }}</label
            >
            <input
              type="email"
              [placeholder]="dict.ph_email[currentLang]"
              class="underline-field w-full py-2 text-sm text-start rtl:text-end"
            />
          </div>
          <div>
            <div class="flex justify-between items-center mb-2">
              <label
                class="block text-[11px] font-semibold tracking-widest uppercase text-white/50"
                >{{ dict.label_password[currentLang] }}</label
              >
              <a
                href="#"
                class="text-[11px] font-semibold text-gold hover:text-goldSoft transition"
                >{{ dict.forgot[currentLang] }}</a
              >
            </div>
            <input
              type="password"
              [placeholder]="dict.ph_password[currentLang]"
              class="underline-field w-full py-2 text-sm text-start rtl:text-end"
            />
          </div>
          <button
            type="button"
            class="gold-btn w-full py-3.5 mt-1 font-semibold tracking-wide rounded-sm text-sm"
          >
            {{ dict.signin_btn[currentLang] }}
          </button>
        </form>
      </div>
      <span class="pennant-jewel"></span>
    </div>
  </div>
</div>
