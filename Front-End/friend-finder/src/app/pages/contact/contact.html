<div class="max-w-3xl mx-auto mt-10 bg-white rounded-xl shadow-lg p-8">
  <h1 class="text-3xl font-bold mb-6 text-center">Contact Support</h1>

  <form (ngSubmit)="sendMessage()">
    <div class="mb-5">
      <label class="block mb-2 font-semibold"> Type </label>

      <select [(ngModel)]="model.type" name="type" class="w-full border rounded-lg p-3">
        <option value="COMPLAINT">Complaint</option>

        <option value="SUGGESTION">Suggestion</option>

        <option value="BUG">Bug</option>

        <option value="OTHER">Other</option>
      </select>
    </div>

    <div class="mb-5">
      <label class="block mb-2 font-semibold"> Message </label>

      <textarea
        rows="8"
        [(ngModel)]="model.message"
        name="message"
        class="w-full border rounded-lg p-3"
        maxlength="3000"
        required
      >
      </textarea>
    </div>

    <button
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg"
      [disabled]="loading"
    >
      {{ loading ? 'Sending...' : 'Send Message' }}
    </button>
  </form>

  <div *ngIf="success" class="text-green-600 mt-5">
    {{ success }}
  </div>

  <div *ngIf="error" class="text-red-600 mt-5">
    {{ error }}
  </div>
</div>
