<div class="timeline-layout">
  <div class="timeline-main">
    <!-- صندوق النشر مغلف بـ if -->
    @if (isMyProfile) {
      <!-- غيرنا posted لـ postCreated وشيلنا الـ $any -->
      <app-post-composer (postCreated)="onPosted($event)"></app-post-composer>
    }
    <!-- شريط التايم لاين -->
    <div class="timeline-rail">
      @for (post of posts(); track post.id) {
        <div class="timeline-item">
          <span class="timeline-dot"></span>
          <p class="timeline-time">{{ post.timeLabel }}</p>

          <!-- كارت البوست -->
          <div class="timeline-post-card">
            @if (post.text) {
              <p class="timeline-post-text">{{ post.text }}</p>
            }

            <!-- عرض الصورة أو الفيديو لو موجودين -->
            @if (post.mediaUrl) {
              <div class="mt-3 rounded-lg overflow-hidden">
                @if (post.mediaType === 'image') {
                  <img
                    [src]="post.mediaUrl"
                    alt="Post media"
                    class="w-full h-auto object-cover max-h-96"
                  />
                } @else if (post.mediaType === 'video') {
                  <video [src]="post.mediaUrl" controls class="w-full max-h-96"></video>
                }
              </div>
            }
          </div>
        </div>
      } @empty {
        <p class="text-sm text-muted mt-4">No posts yet. Be the first to share something!</p>
      }
    </div>
  </div>

  <aside>
    <!-- لوحة النشاطات (مررنا ليها الـ userId) 👇 -->
    <app-recent-activity-panel></app-recent-activity-panel>
  </aside>
</div>
