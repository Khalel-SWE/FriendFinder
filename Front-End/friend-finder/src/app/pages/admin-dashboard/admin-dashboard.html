<div class="p-8">
  <h1 class="text-3xl font-bold mb-8">Admin Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
    <!-- Total Users -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-gray-500 text-sm">Total Users</h2>

      <p class="text-4xl font-bold mt-3">
        {{ stats.totalUsers }}
      </p>
    </div>

    <!-- Total Posts -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-gray-500 text-sm">Total Posts</h2>

      <p class="text-4xl font-bold mt-3">
        {{ stats.totalPosts }}
      </p>
    </div>

    <!-- Total Comments -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-gray-500 text-sm">Total Comments</h2>

      <p class="text-4xl font-bold mt-3">
        {{ stats.totalComments }}
      </p>
    </div>

    <!-- Friendships -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-gray-500 text-sm">Active Friendships</h2>

      <p class="text-4xl font-bold mt-3">
        {{ stats.activeFriendships }}
      </p>
    </div>
  </div>
</div>
