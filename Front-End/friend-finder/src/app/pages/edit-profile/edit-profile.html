<!-- 👇 ضفنا pt-28 عشان الهيدر ما يغطيش على المحتوى 👇 -->
<div class="max-w-3xl mx-auto px-4 pb-8 pt-28">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-white">Edit Profile</h1>
    <p class="text-sm mt-1 text-gray-400">
      Update your personal information and customize your profile appearance.
    </p>
  </div>

  <!-- 👇 لون الكارت بقى متناسق ومفصول عن الخلفية 👇 -->
  <div class="bg-[#161110] rounded-xl shadow-lg border border-white/10 overflow-hidden">
    <!-- قسم تعديل الصور -->
    <div class="p-6 border-b border-white/10">
      <app-profile-media-editor
        [media]="media()"
        (avatarChange)="onAvatarChange($event)"
        (coverChange)="onCoverChange($event)"
      >
      </app-profile-media-editor>
    </div>

    <!-- قسم تعديل البيانات -->
    <div class="p-6">
      <app-profile-details-form [form]="form" (save)="onSave()" (cancel)="onCancel()">
      </app-profile-details-form>
    </div>
  </div>
</div>
