<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="mb-6">
    <h1 class="text-3xl font-bold" style="color: var(--text)">Edit Profile</h1>
    <p class="text-sm mt-1" style="color: var(--muted)">
      Update your personal information and customize your profile appearance.
    </p>
  </div>

  <div class="bg-black/20 rounded-xl shadow-sm border border-white/5 overflow-hidden">
    <!-- قسم تعديل الصور -->
    <div class="p-6 border-b border-gray-100">
      <app-profile-media-editor
        [media]="media()"
        (avatarChange)="onAvatarChange($event)"
        (coverChange)="onCoverChange($event)"
      >
      </app-profile-media-editor>
    </div>

    <!-- قسم تعديل البيانات -->
    <div class="p-6">
      <app-profile-details-form [form]="form" (save)="onSave()" (cancel)="onCancel()">
      </app-profile-details-form>
    </div>
  </div>
</div>
