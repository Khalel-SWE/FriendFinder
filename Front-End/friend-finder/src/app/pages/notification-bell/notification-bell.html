<div class="bell-wrap">
  <button class="bell-btn" (click)="toggle()" type="button">
    <svg
      width="19"
      height="19"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
    >
      <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />

      <path d="M13.7 21a2 2 0 0 1-3.4 0" />
    </svg>

    <span class="bell-badge">3</span>
  </button>

  @if (open()) {
    <div class="bell-menu">
      <p class="bell-title">{{ lang.t('notifications') }}</p>

      <div class="bell-list">
        @for (item of notifications(); track item.id) {
          <div class="bell-item">
            <span class="bell-avatar from-burgundy">
              {{ item.message.charAt(0).toUpperCase() }}
            </span>

            <span class="bell-text">
              {{ item.message }}

              <span class="bell-time">
                {{ item.createdAt | date: 'short' }}
              </span>
            </span>
          </div>
        } @empty {
          <div class="bell-item">
            <span class="bell-text"> No notifications </span>
          </div>
        }
      </div>
    </div>
  }
</div>
