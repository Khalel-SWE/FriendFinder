<div class="p-8 text-white">
  <div class="mb-8">
    <h1 class="text-3xl font-bold">Posts</h1>

    <p class="text-white/50 mt-2">Manage posts published on Friend Finder.</p>
  </div>

  <div *ngIf="loading" class="text-white/50">Loading posts...</div>

  <div *ngIf="!loading" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <div
      *ngFor="let post of posts"
      class="bg-[#16120F] border border-white/10 rounded-xl overflow-hidden"
    >
      <div class="p-5">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="font-semibold text-lg">
              {{ post.firstName }}
              {{ post.lastName }}
            </h2>

            <p class="text-sm text-white/40">
              {{ post.email }}
            </p>
          </div>

          <span class="text-xs text-white/40"> #{{ post.postId }} </span>
        </div>

        <p *ngIf="post.content" class="text-white/80 mb-4 whitespace-pre-line">
          {{ post.content }}
        </p>

        <img
          *ngIf="post.mediaType === 'IMAGE' && post.mediaUrl"
          [src]="'http://localhost:9090' + post.mediaUrl"
          class="w-full max-h-80 object-cover rounded-lg mb-4"
          alt="Post image"
        />

        <video
          *ngIf="post.mediaType === 'VIDEO' && post.mediaUrl"
          [src]="'http://localhost:9090' + post.mediaUrl"
          controls
          class="w-full max-h-80 rounded-lg mb-4"
        ></video>

        <div class="text-xs text-white/40 mb-5">
          {{ post.createdAt | date: 'medium' }}
        </div>

        <button (click)="deletePost(post)" class="bg-red-700 hover:bg-red-600 px-4 py-2 rounded-lg">
          Delete Post
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && posts.length === 0" class="text-center text-white/40 py-12">
    No posts found.
  </div>

  <div class="flex items-center justify-center gap-4 mt-8">
    <button
      (click)="previousPage()"
      [disabled]="currentPage === 0"
      class="px-4 py-2 rounded-lg bg-white/10 disabled:opacity-30"
    >
      Previous
    </button>

    <span class="text-white/60"> Page {{ currentPage + 1 }} / {{ totalPages }} </span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage >= totalPages - 1"
      class="px-4 py-2 rounded-lg bg-white/10 disabled:opacity-30"
    >
      Next
    </button>
  </div>
</div>
