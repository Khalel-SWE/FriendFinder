<div class="ff-card suggestions-card">
  <h3 class="font-display text-lg font-bold mb-4">
    {{ lang.t('suggestions_title') || 'People You May Know' }}
  </h3>

  <div class="flex flex-col gap-4">
    @for (user of filteredSuggestions(); track user.id) {
      <div class="suggestion-row">
        <!-- Avatar -->

        <div class="suggestion-avatar">
          @if (user.profilePicture) {
            <img
              [src]="
                user.profilePicture.startsWith('http')
                  ? user.profilePicture
                  : 'http://localhost:9090' + user.profilePicture
              "
              [alt]="user.firstName + ' ' + user.lastName"
            />
          } @else {
            <span>
              {{ user.initials }}
            </span>
          }
        </div>

        <!-- User info -->

        <div class="suggestion-info">
          <p class="suggestion-name">
            {{ user.firstName }}
            {{ user.lastName }}
          </p>
        </div>

        <!-- Add friend -->

        <button type="button" class="add-btn" (click)="addFriend(user.id)" [title]="lang.t('add')">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />

            <circle cx="8.5" cy="7" r="4" />

            <line x1="20" y1="8" x2="20" y2="14" />

            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
        </button>
      </div>
    } @empty {
      <p class="text-sm text-muted">
        {{ lang.t('admin_no_suggestions') }}
      </p>
    }
  </div>
</div>
